name: Publish archive as independent Worker
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Use a generated encrypted demo (no real archive required)
        type: boolean
        default: true
      work_id:
        description: Stable unique work ID; reusing it updates the same Worker
        type: string
        required: true
        default: pipeline-demo
      archive_url:
        description: HTTPS .7z URL; leave blank to use MEDIA_ARCHIVE_URL secret
        type: string
        default: ''
  workflow_call:
    inputs:
      demo:
        type: boolean
        default: true
      work_id:
        type: string
        required: true
      archive_url:
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      MEDIA_ARCHIVE_PASSWORD:
        required: false
      MEDIA_ARCHIVE_URL:
        required: false
permissions:
  contents: read
concurrency:
  group: archive-worker-${{ inputs.work_id }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout pipeline source
        uses: actions/checkout@v4
        with:
          repository: Laoch832/archive-media-workers
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg 7zip
          echo "SEVEN_ZIP=$(command -v 7zz || command -v 7z || command -v 7za)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - name: Generate encrypted demo archive
        if: inputs.demo
        run: npm run demo
      - name: Extract archive and build independent work
        env:
          ARCHIVE_PATH: ${{ inputs.demo && 'input/demo.7z' || '' }}
          ARCHIVE_URL: ${{ !inputs.demo && (inputs.archive_url || secrets.MEDIA_ARCHIVE_URL) || '' }}
          ARCHIVE_PASSWORD: ${{ inputs.demo && 'demo-only-2026' || secrets.MEDIA_ARCHIVE_PASSWORD }}
          WORK_ID: ${{ inputs.work_id }}
        run: npm run build
      - name: Decode all local HLS videos and verify limits
        run: npm run verify
      - name: Deploy and verify every image, segment and online video
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-reports-${{ github.run_id }}
          path: |
            output/**/build-report.json
            output/**/verification.json
            output/**/live-verification.json
          retention-days: 7
